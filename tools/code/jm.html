<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>zb · 删除密码码生成器</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eff4f1;color:#17231e;margin:0;display:grid;place-items:center;min-height:100vh;padding:20px}.card{width:min(620px,100%);background:white;padding:32px;border-radius:18px;box-shadow:0 18px 60px #193d2c22}h1{margin-top:0}label{display:block;color:#718178;font-size:13px;margin:18px 0 7px}input,button{width:100%;padding:13px;border-radius:10px;border:1px solid #d7e0db;font-size:15px}button{margin-top:18px;background:#187753;color:white;border:0;font-weight:700;cursor:pointer}.result-wrap{display:flex;gap:10px;align-items:stretch;margin-top:20px}.result{flex:1;min-width:0;padding:18px;background:#eff8f4;border:1px dashed #62a889;border-radius:10px;font:700 15px ui-monospace;overflow-wrap:anywhere}.copy{width:auto;margin:0;padding:0 20px;background:white;color:#187753;border:1px solid #62a889}.warn{color:#b33d3d;font-size:12px;line-height:1.7}</style></head>
<body><main class="card"><h1>删除启动密码码生成器</h1><p class="warn">页面不保存管理员签名秘钥。必须同时核对本机识别码和一次性验证码，并将秘钥与本页面分开保管。</p><label for="admin-key">管理员签名秘钥</label><input id="admin-key" type="password" autocomplete="off" spellcheck="false" placeholder="请输入 Ed25519 管理员秘钥"><label for="installation">本机识别码</label><input id="installation" autocomplete="off"><label for="challenge">忘记密码页面的一次性验证码</label><input id="challenge" autocomplete="off" placeholder="XXXX-XXXX-XXXX"><button id="generate">生成并复制删除码</button><div class="result-wrap"><div id="result" class="result">等待生成</div><button id="copy" class="copy" type="button">复制</button></div></main><script>
const LICENSE_PUBLIC_KEY=new Uint8Array([179,80,62,154,71,195,145,235,229,107,61,158,223,170,210,249,134,17,179,94,116,75,115,192,23,125,119,133,97,133,77,17]);
function decode64(value){return Uint8Array.from(atob(value),c=>c.charCodeAt(0))}function base64url(bytes){let raw='';for(const byte of bytes)raw+=String.fromCharCode(byte);return btoa(raw).replaceAll('+','-').replaceAll('/','_').replaceAll('=','')}async function loadSigningKey(value){const key=await crypto.subtle.importKey('pkcs8',decode64(value.replaceAll(/\s/g,'')),{name:'Ed25519'},false,['sign']),proof=new TextEncoder().encode('zhuihen-admin-key-check-v1'),signature=await crypto.subtle.sign('Ed25519',key,proof),publicKey=await crypto.subtle.importKey('raw',LICENSE_PUBLIC_KEY,{name:'Ed25519'},false,['verify']);if(!await crypto.subtle.verify('Ed25519',publicKey,signature,proof))throw new Error('管理员秘钥不正确');return key}async function sign(key,bytes){return new Uint8Array(await crypto.subtle.sign('Ed25519',key,bytes))}async function copy(value){try{await navigator.clipboard.writeText(value)}catch{const area=document.createElement('textarea');area.value=value;document.body.append(area);area.select();document.execCommand('copy');area.remove()}}
document.getElementById('generate').onclick=async()=>{const secret=document.getElementById('admin-key').value.trim(),id=document.getElementById('installation').value.trim().toUpperCase(),challenge=document.getElementById('challenge').value.trim().toUpperCase();if(!secret)return alert('请输入管理员签名秘钥');if(!id||!challenge)return alert('请填写本机识别码和验证码');try{const key=await loadSigningKey(secret),message=new TextEncoder().encode('zhuihen-password-reset-v2|'+id+'|'+challenge),code='ZHR2.'+base64url(await sign(key,message));document.getElementById('result').textContent=code;await copy(code)}catch(error){alert(error instanceof Error&&error.message==='管理员秘钥不正确'?error.message:'管理员秘钥无效，或当前浏览器不支持 Ed25519 签名。\n'+error)}};
document.getElementById('copy').onclick=()=>copy(document.getElementById('result').textContent);
</script></body></html>
